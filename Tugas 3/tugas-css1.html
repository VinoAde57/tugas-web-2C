<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas CSS 1</title>
    <style>
        h2 {
            color: blue;
            font-size: 50px
        }
        /* Untuk class judul warna merah font 30px */
        .judul {
               color: red;
               font-size: 30px;
        }
    </style>
</head>
<body>
    <h1 class="judul">  Nama Saya Vino</h1>
    <h2>Umur saya 20</h2>
    <h2>Alamat saya tulungagung</h2>
    <p class="judul">Lorem ipsum dolor sit amet</p>
</body>
</html>
