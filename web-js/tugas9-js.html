<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 9 Javascript</title>
</head>
<body>
    <h1> Tugas 9 Javascript</h1>
 
    <script type="text/javascript">
        // membuat blueprint Object
        function kendaraan(jenis,roda,warna){
            this.jenis = jenis;
            this.roda = roda;
            this.warna = warna;

            //method atau function
            this.Maju = function(){
                document.write("kendaraan jenis "+
                this.jenis +"bergerak maju <br>");
            }

            this.Mundur = function(){
                document.write("kendaraan jenis "+
                this.jenis +"bergerak mundur <br>");
            }

            this.Belok = function(arah) {
                document.write("Kendaraan Jenis "+
                this.jenis+" Sedang Bergerak Ke "+arah+"<br>");
            }
 
            this.Berhenti = function() {
                document.write("Kendaraan Jenis "+
                this.jenis+" Sedang Berhenti"+"<br>");
            }
        }
        //membuat instance
        var Sedan = new kendaraan("Sedan",4,"Hitam");
 
        var SepedaMotor = new kendaraan("Motor",2,"Biru");
 
        //menuliskan hasil ke browser
        document.write("<h2>Kendaran Jenis "+SepedaMotor.jenis+"</h2>");
        document.write("<h3>Kendaran Warna "+SepedaMotor.warna+"</h3>");
        document.write("<h3>Kendaran Beroda "+SepedaMotor.roda+"</h3>");
 
        //memanggil fungsi
        SepedaMotor.Belok("Kanan");
        Sedan.Maju();
        SepedaMotor.Mundur();
        Sedan.Berhenti();
    </script>
<body>
</html>
